const VL = (id) => VLINES[id];
const VW = (id, f) => { const l = VLINES[id]; return l.t0 + (l.t1 - l.t0) * f; };
const T0 = (id) => VL(id).t0, T1 = (id) => VL(id).t1;
const DURATION = Math.ceil(VOICE.duration * 2) / 2;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
